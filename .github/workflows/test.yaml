name: Automated Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

  python-tests:
    name: Python Application Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Lint Python code
        run: flake8 app.py --max-line-length=120 --ignore=E402
      
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, python-tests]
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t test-app:latest .
      
      - name: Test Docker container
        run: |
          docker run -d -p 8080:80 --name test-container test-app:latest
          sleep 5
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/health || exit 1
          docker stop test-container